###############################################################################
# ModuleTetraBrew — Beispiel: NUR FreeTetra (einfachster Einstieg)
#
# Kopieren nach  /etc/svxlink/svxlink.d/ModuleTetraBrew.conf
# und in der Logic-Sektion der svxlink.conf ergänzen:  MODULES=...,ModuleTetraBrew
#
# -> Nur dein Rufzeichen bei CALL= eintragen, sonst nichts.
###############################################################################

[ModuleTetraBrew]
NAME=TetraBrew
PLUGIN_NAME=TetraBrew
CALL=DO0XXX                 ; <-- DEIN Rufzeichen. Daraus wird automatisch eine feste,
                            ;     diallbare ISSI erzeugt + als Login-Name genutzt.
                            ;     Wer eine eigene DMR-RadioID nutzen will: SRC_ISSI=/USER= unten setzen.
ID=5                        ; DTMF-ID zum Aktivieren (5# = an). Muss frei sein.
TIMEOUT=10800               ; Auto-Release nach 3 h ohne Verkehr (0 = nie)
ANNOUNCE=1                  ; deutsche Sprachansagen
MAX_TX_TIME=180             ; FM->TETRA-Durchgang max. 180 s (Anti-hängender-Träger)
RX_MAX_TIME=180            ; max. TETRA->FM-Durchgang (Sek), 0 = aus (Schutz vor haengendem TETRA-Sender)
RX_JITTER_MS=120           ; Jitter-Vorpuffer TETRA->FM (ms). Hoeher (z.B. 300) bei Mesh/Netz-Jitter (mehr Latenz, weniger Aussetzer/Dumpfheit).
STATUS_INTERVAL=0           ; 0 = Status an die CW-Kennung koppeln (empfohlen)
;AUTO_CONNECT=1             ; Permanent-Knoten: beim Start selbst aktivieren (dann TIMEOUT=0 setzen).
STANDBY=1                  ; dauerhaft eingebucht ohne TG -> immer im Verzeichnis + per SDS erreichbar; Bruecke on-demand (DTMF). Nicht zusammen mit AUTO_CONNECT.
                            ;   Weglassen/0 = on-demand per 5# (wie ModuleEchoLink, Default).
;SRC_ISSI=262102           ; optionaler Override: eigene DMR-RadioID statt der aus CALL abgeleiteten ISSI
DEFAULT_TG=1                ; Talkgroup beim Aktivieren (Heimat-TG)
TG_IDLE_RESET=600           ; nach X s Ruhe auf einer Fremd-TG zurueck auf DEFAULT_TG (0 = aus).
                            ;   verhindert versehentliches Dauer-Haengen in einer TG.
BREW_SERVERS=FreeTetra

# --- FreeTetra: der freie Community-Server, vernetzt FM-Repeater + TETRA-BlueStations ---
[ModuleTetraBrew_FreeTetra]
HOST=127.0.0.1             ; lokaler TLS-Proxy (install.sh richtet ihn ein)
PORT=18443
HOST_HEADER=freetetra.de   ; Server hinter nginx -> HTTP-Host/SNI nötig
;USER=262102              ; optionaler Override des Login-Namens (Default: CALL von oben)
PASSWORD=freetetra         ; öffentliches Community-Passwort
REALM=brew
GSSI_MIN=1                 ; nur EIN Server -> ganzer TG-Bereich läuft über FreeTetra
GSSI_MAX=16777215          ; (die 1..90/91+-Aufteilung braucht man nur mit mehreren Servern)
RX_GAIN=4.0                ; Lautstärke TETRA->FM (bei Bedarf anpassen)
