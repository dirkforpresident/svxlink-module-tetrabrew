###############################################################################
# ModuleTetraBrew — Beispiel: NUR FreeTetra (einfachster Einstieg)
#
# Kopieren nach  /etc/svxlink/svxlink.d/ModuleTetraBrew.conf
# und in der Logic-Sektion der svxlink.conf ergänzen:  MODULES=...,ModuleTetraBrew
#
# -> Nur <deine RadioID> an 2 Stellen eintragen, sonst nichts.
###############################################################################

[ModuleTetraBrew]
NAME=TetraBrew
PLUGIN_NAME=TetraBrew
ID=5                        ; DTMF-ID zum Aktivieren (5# = an). Muss frei sein.
TIMEOUT=10800               ; Auto-Release nach 3 h ohne Verkehr (0 = nie)
ANNOUNCE=1                  ; deutsche Sprachansagen
MAX_TX_TIME=180             ; FM->TETRA-Durchgang max. 180 s (Anti-hängender-Träger)
STATUS_INTERVAL=0           ; 0 = Status an die CW-Kennung koppeln (empfohlen)
SRC_ISSI=DEINE_RADIOID            ; <-- DEINE RadioID (radioid.net)
DEFAULT_TG=1                ; Talkgroup beim Aktivieren
BREW_SERVERS=FreeTetra

# --- FreeTetra: der freie Community-Server, vernetzt FM-Repeater + TETRA-BlueStations ---
[ModuleTetraBrew_FreeTetra]
HOST=127.0.0.1             ; lokaler TLS-Proxy (install.sh richtet ihn ein)
PORT=18443
HOST_HEADER=freetetra.de   ; Server hinter nginx -> HTTP-Host/SNI nötig
USER=DEINE_RADIOID               ; <-- DEINE RadioID
PASSWORD=freetetra         ; öffentliches Community-Passwort
REALM=brew
GSSI_MIN=1                 ; nur EIN Server -> ganzer TG-Bereich läuft über FreeTetra
GSSI_MAX=16777215          ; (die 1..90/91+-Aufteilung braucht man nur mit mehreren Servern)
RX_GAIN=4.0                ; Lautstärke TETRA->FM (bei Bedarf anpassen)
