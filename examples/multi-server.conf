###############################################################################
# ModuleTetraBrew — Beispiel: FreeTetra (TG 1-90) + zweiter BREW-Server (TG 91+)
#
# Ein Relais, mehrere Netze — Auswahl per Talkgroup. Wie eine BlueStation mit
# zwei [[brew]]-Blöcken, aber nativ. DTMF: 5# = FreeTetra TG 1, 5<tg># = direkt TG.
#
# Der zweite Server ist frei wählbar (irgendein BREW-fähiges TETRA-Netz/Gateway).
# BITTE mit GSSI_ALLOW auf ruhige/regionale/Test-TGs beschränken (Etikette!),
# und die Regeln des jeweiligen Netzes beachten — du bist verantwortlich.
###############################################################################

[ModuleTetraBrew]
NAME=TetraBrew
PLUGIN_NAME=TetraBrew
ID=5
TIMEOUT=10800
ANNOUNCE=1
MAX_TX_TIME=180             ; FM->TETRA-Durchgang max. (Sek)
RX_MAX_TIME=180             ; TETRA->FM-Durchgang max. (Sek), 0 = aus (Schutz vor haengendem TETRA-Sender)
STATUS_INTERVAL=0
SRC_ISSI=DEINE_RADIOID            ; Standard-ISSI/RadioID (pro Server überschreibbar)
DEFAULT_TG=1
TG_IDLE_RESET=600           ; nach X s Ruhe auf Fremd-TG zurueck auf DEFAULT_TG (0 = aus)
BREW_SERVERS=FreeTetra,Weiteres

# --- FreeTetra (freies Community-Netz), TG 1-90 ---
[ModuleTetraBrew_FreeTetra]
HOST=127.0.0.1
PORT=18443
HOST_HEADER=freetetra.de
USER=DEINE_RADIOID
PASSWORD=freetetra
REALM=brew
GSSI_MIN=1
GSSI_MAX=90
RX_GAIN=4.0

# --- Zweiter BREW-Server (frei wählbar), TG 91+ ---
[ModuleTetraBrew_Weiteres]
HOST=127.0.0.1
PORT=18444                 ; zweiter lokaler TLS-Proxy, falls der Server TLS (wss://) spricht
HOST_HEADER=dein-brew-server.example    ; Hostname/SNI des Servers
USER=DEINE_ISSI_DORT
PASSWORD=DEIN_PASSWORT
REALM=brew                 ; Realm zieht das Modul eh aus der Server-Challenge
SRC_ISSI=DEINE_ISSI_DORT   ; ISSI/RadioID, mit der du in diesem Netz registrierst
GSSI_MIN=91
GSSI_MAX=16777215
GSSI_ALLOW=                 ; z.B. 2621,2622 — nur diese TGs wählbar (dringend empfohlen)
RX_GAIN=4.0
