###############################################################################
# ModuleTetraBrew — Multi-Brew FM<->TETRA-Gateway.
# Alles config-getrieben: BREW_SERVERS listet Endpunkte, jeder kriegt eine
# eigene Sektion [ModuleTetraBrew_<Name>]. Nichts im Code hartcodiert.
# (Echte Passwörter NICHT ins Git — hier nur Platzhalter.)
###############################################################################

[ModuleTetraBrew]
NAME=TetraBrew
PLUGIN_NAME=TetraBrew
ID=5
TIMEOUT=10800               ; Inaktivitäts-Auto-Release (Sek), 0 = nie (hier 3 h)
STATUS_INTERVAL=600         ; periodische „verbunden mit"-Ansage (Sek), 0 = aus (hier 10 min)
ANNOUNCE=1                  ; deutsche Sprachansagen an/aus
MAX_TX_TIME=180             ; max. FM->TETRA-Durchgang (Sek), 0 = aus
SRC_ISSI=DEINE_RADIOID            ; Standard-ISSI des Relais (pro Endpunkt überschreibbar)
DEFAULT_TG=1               ; TG beim Aktivieren (fällt in FreeTetra 1-90)
BREW_SERVERS=FreeTetra,Weiteres

# --- Eigenes FreeTetra-Netz: TG 1-90 (via lokalem TLS-Proxy :18443) ---
[ModuleTetraBrew_FreeTetra]
HOST=127.0.0.1
PORT=18443
HOST_HEADER=freetetra.de   ; HTTP-Host/SNI (Server hinter nginx)
USER=DEINE_RADIOID
PASSWORD=freetetra         ; öffentliches Community-Passwort
REALM=brew
GSSI_MIN=1
GSSI_MAX=90
RX_GAIN=4.0

# --- Weiteres: TG 91+ (via lokalem TLS-Proxy :18444) ---
[ModuleTetraBrew_Weiteres]
HOST=127.0.0.1
PORT=18444
HOST_HEADER=dein-brew-server.example
USER=DEINE_ISSI             ; ISSI/RadioID in diesem Netz
PASSWORD=CHANGEME
REALM=brew
GSSI_MIN=91
GSSI_MAX=16777215
; GSSI_ALLOW=2621,2622     ; optional: nur diese TGs erlauben (Troll-Bremse)
RX_GAIN=4.0
